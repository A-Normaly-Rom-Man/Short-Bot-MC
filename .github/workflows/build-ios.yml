name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS app with Xcode
        run: |
          set -e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e

          APP_PATH=$(find ios/build/DerivedData -path "*/Build/Products/Release-iphoneos/*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in Release-iphoneos build output."
            find ios/build/DerivedData -maxdepth 6 -type d | head -n 50
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          zip -qr ShortBot.ipa Payload

          ls -l ShortBot.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortBot-Unsigned-IPA
          path: ShortBot.ipa
          if-no-files-found: error